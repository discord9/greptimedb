[default.extend-words]
Pn = "Pn"
ue = "ue"
worl = "worl"
ot = "ot"
typ = "typ"
typs = "typs"
unqualifed = "unqualifed"
excluder = "excluder"
consts = "consts"
# Unicode general category "decimal digit" in regex classes.
Nd = "Nd"
# Upstream crate rskafka defines a `DeadlineExceded` error variant, but it is misspelled. 
# We need to extend the word list to avoid typos in our codebase.
Exceded = "Exceded"

[default.extend-identifiers]
allocatedp = "allocatedp"

[files]
extend-exclude = [
    "corrupted",
    "tests-fuzz/src/data/lorem_words",
    "*.sql",
    "*.result",
    "src/pipeline/benches/data.log",
    "cyborg/pnpm-lock.yaml",
    "tests-integration/resources/*",
    # Golden fixtures generated by the Prometheus engine; hex float bits look like words.
    "src/promql/src/**/*_cases.txt",
    # Benchmark records and their hash manifest are generated by
    # `scripts/fused_series_bench_pair.sh`. Record files are named `c<case>-r<round>-<arm>.json`,
    # and the `control` case therefore reads `ccontrol-...`, which a spelling check flags.
    "docs/bench-records/*"
]
