[package]
name = "paper-ffx-auto-rewrite"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[workspace]

[dependencies]
arrow = "=59.2.0"
datafusion = { git = "https://github.com/GreptimeTeam/datafusion.git", rev = "4bd567a884dcbfd89d0f0a7859ef8367e38fff97", default-features = false, features = [
    "sql",
] }
datafusion-common = { git = "https://github.com/GreptimeTeam/datafusion.git", rev = "4bd567a884dcbfd89d0f0a7859ef8367e38fff97" }
datafusion-expr = { git = "https://github.com/GreptimeTeam/datafusion.git", rev = "4bd567a884dcbfd89d0f0a7859ef8367e38fff97" }
datafusion-functions-aggregate = { git = "https://github.com/GreptimeTeam/datafusion.git", rev = "4bd567a884dcbfd89d0f0a7859ef8367e38fff97" }
datafusion-optimizer = { git = "https://github.com/GreptimeTeam/datafusion.git", rev = "4bd567a884dcbfd89d0f0a7859ef8367e38fff97" }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread"] }
